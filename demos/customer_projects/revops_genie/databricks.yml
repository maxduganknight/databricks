# RevOps — Revenue Intelligence demo, packaged as a Databricks Asset Bundle.
#
# Re-creates the whole demo on any workspace: a UC schema + a churn-docs volume,
# a 5-page AI/BI dashboard, and a setup job that builds the data + governed
# semantic layer, extracts the churn/QBR PDFs, and stands up the 5 Genie spaces
# and the Genie One scheduled insight.
#
# Story: Mid-Market net revenue retention compressed from ~108% to ~90% over four
# months; the drain is retention-driven (competitive displacement + a missing
# real-time budget-approval feature, extracted from QBR/cancellation PDFs). A
# Genie One scheduled insight finds Maya Chen, Director of RevOps, who investigates
# conversationally across the governed sem_* layer and the unstructured evidence.
#
# ── Deploy (workflow-only — no app) ────────────────────────────────────────
#   1. databricks bundle deploy --var catalog=… --var schema=… --var warehouse_id=…
#   2. databricks bundle run revops_setup --var catalog=… --var schema=… --var warehouse_id=…
# See dab_instructions.md.

bundle:
  name: revops_intelligence

variables:
  catalog:
    description: "Unity Catalog for the demo resources"
    default: "solution_builder"
  schema:
    description: "Schema within the catalog (created by this bundle)"
    default: "demo_revops_intelligence"
  warehouse_id:
    description: "SQL Warehouse ID — powers the dashboard, Genie spaces, and the scheduled insight"
    default: "a94beda3aab06fa4"

sync:
  include:
    - "src/**"
    - "unstructured/**"   # extract_churn_docs.sql + the pre-rendered QBR PDFs
    - "alert/**"          # scheduled_insight.json template

targets:
  dev:
    default: true
    mode: development   # prefixes the schema with `dev_<user>_`; tasks resolve
                        # the schema via ${resources.schemas.revops_schema.name}
                        # so they hit the same prefixed schema.
  prod:
    mode: production

resources:
  # ──────────────────────────────────────────────────────────────────────────
  # Schema + volume (the QBR/churn PDFs land here for ai_parse_document).
  # ──────────────────────────────────────────────────────────────────────────
  schemas:
    revops_schema:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      comment: "RevOps Revenue Intelligence — GTM facts/dims, sem_* semantic layer, and extracted churn evidence"

  volumes:
    raw_churn_docs:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.revops_schema.name}
      name: "raw_churn_docs"
      volume_type: "MANAGED"
      comment: "QBR / cancellation PDFs — parsed by ai_parse_document + ai_extract into fact_churn_reason"

  # ──────────────────────────────────────────────────────────────────────────
  # AI/BI dashboard — 5 pages (NRR cliff, attainment, net-new ARR, renewal risk,
  # GTM efficiency). dataset_catalog/dataset_schema rebind the bare-table queries
  # per-target. Requires CLI v0.283.0+.
  # ──────────────────────────────────────────────────────────────────────────
  dashboards:
    revops_dashboard:
      display_name: "[${bundle.target}] Revenue Intelligence"
      file_path: ./dashboard.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${resources.schemas.revops_schema.catalog_name}
      dataset_schema: ${resources.schemas.revops_schema.name}

  # ──────────────────────────────────────────────────────────────────────────
  # Setup job — fills the shells after `bundle deploy`:
  #   generate_data → tables + sem_* views + predict_net_new_arr()
  #   upload_pdfs → churn PDFs to the volume
  #   run_extract_churn → fact_churn_reason (ai_parse_document + ai_extract)
  #   deploy_genie → the 5 Genie spaces
  #   deploy_alert → the Genie One scheduled insight
  # ──────────────────────────────────────────────────────────────────────────
  jobs:
    revops_setup:
      name: "[${bundle.target}] RevOps Setup"
      description: "data + sem layer → churn PDFs → extract → genie spaces → scheduled insight"
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ./src/data_generation/generate_data.py
            base_parameters:
              catalog: ${resources.schemas.revops_schema.catalog_name}
              schema:  ${resources.schemas.revops_schema.name}
          environment_key: sdk_default

        - task_key: deploy_metric_view
          depends_on:
            - task_key: generate_data
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./src/metrics/mv_revenue_retention.metric_view.sql
            parameters:
              catalog: ${resources.schemas.revops_schema.catalog_name}
              schema:  ${resources.schemas.revops_schema.name}

        - task_key: upload_pdfs
          notebook_task:
            notebook_path: ./src/deploy/upload_pdfs.py
            base_parameters:
              catalog: ${resources.schemas.revops_schema.catalog_name}
              schema:  ${resources.schemas.revops_schema.name}
          environment_key: sdk_default

        - task_key: run_extract_churn
          depends_on:
            - task_key: generate_data
            - task_key: upload_pdfs
          notebook_task:
            notebook_path: ./src/deploy/run_extract_churn.py
            base_parameters:
              catalog: ${resources.schemas.revops_schema.catalog_name}
              schema:  ${resources.schemas.revops_schema.name}
          environment_key: sdk_default

        - task_key: deploy_genie
          depends_on:
            - task_key: generate_data
            - task_key: run_extract_churn
          notebook_task:
            notebook_path: ./src/deploy/deploy_genie.py
            base_parameters:
              catalog:      ${resources.schemas.revops_schema.catalog_name}
              schema:       ${resources.schemas.revops_schema.name}
              warehouse_id: ${var.warehouse_id}
          environment_key: sdk_latest

        - task_key: deploy_alert
          depends_on:
            - task_key: generate_data
            - task_key: run_extract_churn
          notebook_task:
            notebook_path: ./src/deploy/deploy_alert.py
            base_parameters:
              catalog: ${resources.schemas.revops_schema.catalog_name}
              schema:  ${resources.schemas.revops_schema.name}
          environment_key: sdk_latest

      environments:
        - environment_key: sdk_default
          spec:
            client: "4"
        - environment_key: sdk_latest
          spec:
            client: "4"
            dependencies:
              - "databricks-sdk>=0.114.0"
