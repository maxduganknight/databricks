    <text x="370" y="335" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">pdu_minute_stats</text>
    <text x="370" y="354" text-anchor="middle" font-size="10.5" fill="#5f7281">streaming table · 1-min windows</text>
