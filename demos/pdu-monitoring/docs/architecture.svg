    <text x="390" y="52" text-anchor="middle" font-size="11" fill="#5f7281">refreshed every 5 min by the pdu-refresh job · serverless</text>
    <text x="135" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#a8622a">Bronze</text>
    <text x="370" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#5d6b77">Silver</text>
    <text x="625" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#a07a00">Gold</text>
    <text x="943" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#d2301c">PDU Monitoring App</text>
    <text x="943" y="96" text-anchor="middle" font-size="11" fill="#5f7281">Databricks App (Dash)</text>
    <path d="M250 90 V650" stroke="#c9d1d8" stroke-width="1.5"/>
    <path d="M490 90 V650" stroke="#c9d1d8" stroke-width="1.5"/>
    <rect x="800" y="104" width="286" height="546" rx="12" fill="#fff5f3" stroke="#ffb3a8" stroke-width="1.5"/>
    <rect x="530" y="100" width="210" height="74" rx="8" fill="#e3f2f7" stroke="#077A9D" stroke-width="1.5"/>
    <text x="635" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#055a74">Lakebase (Postgres)</text>
    <text x="635" y="141" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">pdu_latest_status_synced</text>
    <text x="635" y="160" text-anchor="middle" font-size="10.5" fill="#5f7281">+ technician_alerts, unit_notes</text>
    <rect x="818" y="112" width="250" height="52" rx="8" fill="#ffffff" stroke="#FF3621" stroke-width="1.5"/>
    <text x="943" y="134" text-anchor="middle" font-size="13" font-weight="700">Rack overview page</text>
    <text x="943" y="152" text-anchor="middle" font-size="10.5" fill="#5f7281">KPIs · one tile per PDU · worst offenders</text>
    <rect x="818" y="206" width="250" height="52" rx="8" fill="#ffffff" stroke="#FF3621" stroke-width="1.5"/>
    <text x="943" y="228" text-anchor="middle" font-size="13" font-weight="700">PDU unit troubleshooting page</text>
    <text x="943" y="246" text-anchor="middle" font-size="10.5" fill="#5f7281">second-level charts · alert technician · notes</text>
    <rect x="818" y="472" width="250" height="52" rx="8" fill="#ffffff" stroke="#FF3621" stroke-width="1.5"/>
    <text x="943" y="494" text-anchor="middle" font-size="13" font-weight="700">Predictive breach risk page</text>
    <text x="943" y="512" text-anchor="middle" font-size="10.5" fill="#5f7281">units ranked by 12-hour breach risk</text>
    <rect x="818" y="580" width="250" height="52" rx="8" fill="#ffffff" stroke="#FF3621" stroke-width="1.5"/>
