    <text x="135" y="335" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">bronze_pdu_telemetry</text>
    <text x="135" y="354" text-anchor="middle" font-size="10.5" fill="#5f7281">V · A · W · temp · humidity, per second</text>
