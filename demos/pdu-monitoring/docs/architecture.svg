    <path d="M470 330 H508" stroke="#44515c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M470 409 H490 V356 H508" stroke="#7d8b97" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>
    <path d="M625 290 V176" stroke="#077A9D" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="633" y="272" font-size="10.5" fill="#055a74">snapshot sync</text>
    <path d="M740 138 H816" stroke="#077A9D" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="778" y="130" text-anchor="middle" font-size="9.5" fill="#055a74">low-latency</text>
    <rect x="270" y="196" width="200" height="72" rx="8" fill="#eef1f4" stroke="#7d8b97" stroke-width="1.5"/>
    <text x="370" y="218" text-anchor="middle" font-size="13" font-weight="700">Last hour, per second</text>
    <text x="370" y="237" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">pdu_recent_readings</text>
    <text x="370" y="255" text-anchor="middle" font-size="10.5" fill="#5f7281">view · last 60 min</text>
    <path d="M135 290 V232 H268" stroke="#44515c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M470 232 H816" stroke="#44515c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="636" y="224" font-size="10.5" fill="#5f7281">on-demand query · SQL warehouse</text>
    <path d="M30 452 H780" stroke="#9aa5ae" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="40" y="472" font-size="11" font-style="italic" fill="#7d8b97">Analytics &amp; ML</text>
    <rect x="510" y="470" width="230" height="92" rx="8" fill="#fff6d6" stroke="#c99a00" stroke-width="1.5"/>
    <text x="625" y="492" text-anchor="middle" font-size="13" font-weight="700">Predictive Maintenance</text>
    <text x="625" y="510" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">feature views (pm_*)</text>
    <text x="625" y="529" text-anchor="middle" font-size="10.5" fill="#5f7281">→ breach-risk model (MLflow champion)</text>
    <text x="625" y="547" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#5f7281">→ pdu_breach_risk_predictions</text>
    <path d="M290 370 V606 H816" stroke="#44515c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M290 516 H508" stroke="#44515c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="300" y="508" font-size="10.5" fill="#5f7281">point-in-time features</text>
    <text x="300" y="598" font-size="10.5" fill="#5f7281">Genie space over silver &amp; gold PDU tables</text>
    <path d="M740 516 H780 V498 H816" stroke="#44515c" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="550" y="680" text-anchor="middle" font-size="11" fill="#7d8b97">All tables governed in Unity Catalog · deployed as one Declarative Automation Bundle (pipeline, jobs, Lakebase, app, alerts)</text>
