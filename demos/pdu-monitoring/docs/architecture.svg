<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="2200" height="1500" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44515c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="750" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="700" fill="#1b2733">PDU Monitoring: Proposed Architecture</text>
  <text x="20" y="50" font-size="13" fill="#5f7281">Medallion pipeline on Databricks serving a Databricks App for rack operators</text>
  <g transform="translate(0,60)" fill="#1b2733">
