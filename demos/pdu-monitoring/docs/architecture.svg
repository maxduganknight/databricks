    <text x="625" y="335" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">pdu_latest_status</text>
    <text x="625" y="354" text-anchor="middle" font-size="10.5" fill="#5f7281">materialized view · 1 row per PDU</text>
