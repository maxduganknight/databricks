# Synthetic bronze telemetry generator (demo only - a real deployment already has bronze data).
# Run on demand for the initial backfill; the scheduled pdu-refresh job (refresh.job.yml) calls the same notebook.
resources:
  jobs:
    pdu_synthetic_generator:
      name: pdu-synthetic-telemetry-generator
      description: Appends synthetic second-level PDU telemetry up to now and applies retention.
      max_concurrent_runs: 1
      parameters:
        - name: backfill_hours
          default: ${var.backfill_hours}
      tasks:
        - task_key: generate_telemetry
          # No cluster spec -> runs on serverless jobs compute.
          notebook_task:
            notebook_path: ../src/notebooks/generate_synthetic_telemetry.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              bronze_table: ${var.bronze_table}
              backfill_hours: "{{job.parameters.backfill_hours}}"
              retention_days: ${var.bronze_retention_days}
              num_racks: ${var.num_racks}
              shelves: ${var.rack_shelves}
              positions: ${var.rack_positions}
      email_notifications:
        on_failure:
          - ${var.alert_email}
