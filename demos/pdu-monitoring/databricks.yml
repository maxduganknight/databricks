# PDU Monitoring prototype - Declarative Automation Bundle
# SDP pipeline + Lakebase (Postgres) + Databricks App for rack PDU telemetry.
# No workspace hosts, user names, IDs or secrets are stored here; authenticate with the
# Databricks CLI (profile / env vars) and override variables per workspace.

bundle:
  name: pdu_monitoring

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the PDU monitoring schema.
    default: mdk_demo_catalog
  schema:
    # Treated as a prerequisite (it holds the customer's existing bronze table), so it is NOT a
    # bundle-managed resource: `bundle destroy` must never drop bronze data. The synthetic data
    # generator creates it if missing.
    description: Schema for bronze telemetry and pipeline outputs.
    default: pdu_monitoring
  bronze_table:
    description: Name (within catalog.schema) of the second-level bronze telemetry table.
    default: bronze_pdu_telemetry
  warehouse_id:
    description: SQL warehouse used by the app for bronze troubleshooting queries (looked up by name).
    lookup:
      warehouse: Serverless Starter Warehouse
  lakebase_project:
    description: Lakebase Postgres project id for app state and synced tables (lowercase, hyphens).
    default: pdu-monitoring
  lakebase_database:
    description: Postgres database (inside the Lakebase project) used by the app.
    default: pdu_monitoring
  app_name:
    description: Databricks App name (workspace-unique, lowercase letters, digits, hyphens).
    default: pdu-monitor
  alert_email:
    description: Recipient for job failure / breach notifications.
    default: ${workspace.current_user.userName}
  breach_alert_pause_status:
    description: UNPAUSED or PAUSED for the every-5-minutes breach alert (keeps the SQL warehouse warm).
    default: UNPAUSED

targets:
  dev:
    default: true
    mode: development
    variables:
      # Per-developer Lakebase project and app name so dev never collides with prod.
      lakebase_project: pdu-monitoring-dev
      app_name: pdu-monitor-${workspace.current_user.domain_friendly_name}
      # Avoid keeping the warehouse running 24/7 in dev; unpause with --var breach_alert_pause_status=UNPAUSED.
      breach_alert_pause_status: PAUSED

  prod:
    mode: production
    workspace:
      # Deploy to the deploying identity's folder (ideally a CI service principal), not /Shared.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    # Override per workspace, e.g. databricks bundle deploy -t prod --var catalog=<catalog>
